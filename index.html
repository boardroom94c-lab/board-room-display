<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Board Room Schedule</title>

<style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
    }

    body {
        display: flex;
        align-items: center;
        justify-content: center;
    }

    #schedule {
        width: 100vw;
        height: 100vh;
        object-fit: contain;
        display: block;
    }

    #message {
        position: fixed;
        color: white;
        font-family: Arial, sans-serif;
        font-size: 28px;
        text-align: center;
        display: none;
    }
</style>
</head>

<body>

<img id="schedule" alt="Board Room Schedule">

<div id="message">
    Today's schedule is not available.
</div>

<script>

const REFRESH_MINUTES = 5;

function getTodayFileName() {

    const today = new Date();

    const year = today.getFullYear();

    const month = String(today.getMonth() + 1).padStart(2, "0");

    const day = String(today.getDate()).padStart(2, "0");

    return year + "." + month + "." + day + ".jpg";
}


function loadSchedule() {

    const image = document.getElementById("schedule");
    const message = document.getElementById("message");

    // Automatically create today's filename
    const imageFile = getTodayFileName();

    // Prevent browser caching
    image.src = imageFile + "?v=" + Date.now();

    image.onload = function () {

        image.style.display = "block";

        message.style.display = "none";

    };

    image.onerror = function () {

        image.style.display = "none";

        message.style.display = "block";

        message.textContent =
            "Today's schedule is not available.";
    };
}


// Load schedule immediately
loadSchedule();


// Check every 5 minutes
setInterval(
    loadSchedule,
    REFRESH_MINUTES * 60 * 1000
);

</script>

</body>
</html>
